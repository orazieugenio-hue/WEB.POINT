<style id="wp-edits">/* ===== Web Point edits ===== */
/* 1 · Carrusel de diseños: protagonista, más grande y centrado */
.wp-showcase{display:flex;flex-direction:column;justify-content:center;padding:100px 0 76px}
.wp-showcase-seam{--wp-mid:color-mix(in oklab, #060c18, #ffffff);position:absolute;left:0;right:0;bottom:0;z-index:6;pointer-events:none;height:clamp(80px,9vw,140px);background:linear-gradient(0deg,var(--wp-mid) 0%,color-mix(in oklab, var(--wp-mid) 72%, transparent) 24%,color-mix(in oklab, var(--wp-mid) 40%, transparent) 50%,color-mix(in oklab, var(--wp-mid) 14%, transparent) 77%,transparent 100%)}
.wp-showcase-rail{perspective:2300px}
.wp-showcase-track{gap:22px}
.wp-showcase-card{width:min(84vw,360px)}
.wp-showcase-fade{height:56px}
.wp-showcase-bottom{height:30%}
@media (min-width:768px){
  .wp-showcase{padding:128px 0 104px}
  .wp-showcase-rail{perspective:2700px}
  .wp-showcase-track{gap:36px}
  .wp-showcase-card{width:clamp(480px,46vw,740px)}
  .wp-showcase-fade{height:110px}
}
/* 6 · Precios POINT */
.wp-plans{align-items:start}
.wp-price-box{min-height:58px;display:flex;align-items:flex-end}
.wp-price{display:flex;align-items:flex-start;font-family:var(--font-brand);font-weight:300;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.wp-price-cur{font-size:17px;font-weight:400;letter-spacing:.08em;margin:6px 8px 0 0;opacity:.75}
.wp-price-int{font-size:56px}
.wp-price-dec{font-size:24px;margin:4px 0 0 3px}
.wp-price-per{align-self:flex-end;font-size:18px;margin:0 0 5px 6px;opacity:.75}
.wp-price-md .wp-price-cur{font-size:14px;margin-top:4px}
.wp-price-md .wp-price-int{font-size:38px}
.wp-price-md .wp-price-dec{font-size:17px;margin-top:3px}
.wp-price-md .wp-price-per{font-size:15px;margin-bottom:3px}
.wp-plan-toggle{cursor:pointer}
.wp-plan-toggle:hover span{text-decoration:underline;text-underline-offset:5px}
.wp-plans article>p:first-of-type{min-height:72px}
/* 8 · "Una web hecha a tu medida" y "Mucho más que una página web" avanzan con el scroll */
:root{--wp-top:calc(65px + env(safe-area-inset-top,0px))}
@media (min-width:768px){:root{--wp-top:calc(77px + env(safe-area-inset-top,0px))}}
.wp-scrolly{--wp-step:44svh;position:relative;margin-top:36px}
.wp-scrolly-space{height:calc(var(--wp-n) * var(--wp-step))}
.wp-scrolly-pin{position:sticky;top:var(--wp-top);height:calc(100svh - var(--wp-top));display:flex;flex-direction:column;justify-content:center;padding:12px 0 16px}
.wp-scrolly-grid{display:flex;flex-direction:column;gap:16px;height:100%;min-height:0}
.wp-vis{order:-1;flex:none;height:clamp(190px,40svh,340px)}
.wp-vis>*{zoom:var(--wp-vz,1)}
.wp-scrolly-col{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.wp-scrolly-list{position:relative;flex:0 1 auto;min-height:0;overflow:hidden}
.wp-scrolly-list[data-ov]{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 36px),transparent)}
.wp-scrolly-list[data-ov][data-top]{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 26px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 26px,#000 calc(100% - 36px),transparent)}
.wp-scrolly-list[data-ov][data-end]{-webkit-mask-image:none;mask-image:none}
.wp-scrolly-list[data-ov][data-top][data-end]{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 26px);mask-image:linear-gradient(180deg,transparent 0,#000 26px)}
.wp-acc-btn{padding:14px 0}
.wp-acc-title{font-size:17px;line-height:1.35}
.wp-acc-text{padding-bottom:16px}
.wp-acc-btn-x{padding-top:12px;padding-bottom:12px}
.wp-acc-title-x{font-size:16.5px;line-height:1.35}
.wp-acc-body-x{padding-bottom:16px}
.wp-only-desk{display:none}
@media (min-width:1024px){
  .wp-scrolly{--wp-step:40vh;margin-top:48px;--wp-vh:min(580px,calc(100svh - var(--wp-top) - 48px))}
  .wp-scrolly-x{--wp-vh:min(480px,calc(100svh - var(--wp-top) - 48px))}
  .wp-scrolly-pin{height:auto;padding:0;top:calc(var(--wp-top) + (100svh - var(--wp-top) - var(--wp-vh)) / 2)}
  .wp-scrolly-grid{display:grid;align-items:start;height:auto;max-height:100%}
  .wp-k{grid-template-columns:1fr 1.25fr;gap:80px}
  .wp-x{grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:24px}
  .wp-vis{order:0;height:var(--wp-vh)}
  .wp-scrolly-col{max-height:calc(100svh - var(--wp-top) - 48px)}
  .wp-acc-btn{padding:20px 0}
  .wp-acc-title{font-size:19px}
  .wp-acc-text{padding-bottom:24px}
  .wp-acc-btn-x{padding-top:16px;padding-bottom:16px}
  .wp-acc-title-x{font-size:17px}
  .wp-acc-body-x{padding-bottom:20px}
  .wp-only-desk{display:block}
  .wp-only-mob{display:none}
}
.wp-scrolly.is-static{height:auto}
.wp-scrolly.is-static .wp-scrolly-space{display:none}
.wp-scrolly.is-static .wp-scrolly-pin{position:static;height:auto;padding:0}
.wp-scrolly.is-static .wp-scrolly-grid{height:auto}
.wp-scrolly.is-static .wp-scrolly-list{overflow:visible;-webkit-mask-image:none;mask-image:none}
.wp-scrolly.is-static .wp-vis{height:300px}
@media (min-width:1024px){.wp-scrolly.is-static .wp-vis{height:520px}}
.wp-scrolly.is-static .wp-scrolly-col{max-height:none}
</style>

ito."}],O=[{id:"precio",tag:"Guía",title:"¿Cuánto cuesta una página web en 2026?",img:"img/blog-price.webp",read:"6 min",body:["El precio de una web depende sobre todo de tres cosas: cuántas páginas necesitas, qué tiene que hacer (vender, reservar, captar contactos) y cuánto contenido hay que preparar.","Como referencia: una landing de una sola página suele moverse entre 400 y 900 €; una web corporativa de cinco a ocho páginas, entre 900 y 2.500 €; y una tienda online bien montada, a partir de 1.500 €.","Más allá del precio inicial, pregunta siempre por el mantenimiento, el alojamiento y quién será el propietario del dominio. Una web barata que nadie mantiene acaba saliendo cara."]},{id:"textos",tag:"Contenido",title:"Cómo preparar los textos de tu web en una tarde",img:"img/blog-texts.webp",read:"5 min",body:["Empieza por responder tres preguntas en una frase cada una: qué haces, para quién lo haces y por qué deberían elegirte a ti.","Después, escribe una sección por cada servicio con el problema que resuelve, cómo trabajas y el resultado que obtiene tu cliente. Frases cortas y palabras que use tu cliente, no tu sector.","Por último, reúne pruebas: reseñas reales, fotos de tu trabajo y datos concretos. Con eso, el diseño tiene todo lo necesario para brillar."]},{id:"lanzamiento",tag:"Checklist",title:"20 cosas que revisar antes de publicar tu web",img:"img/blog-launch.webp",read:"4 min",body:["Comprueba que cada formulario llega al correo correcto, que todos los enlaces funcionan y que el teléfono se puede pulsar en el móvil.","Revisa títulos y descripciones de cada página, añade texto alternativo a las imágenes y verifica que la web carga en menos de tres segundos.","Configura la analítica, el banner de cookies y los textos legales, y prepara una copia de seguridad antes del gran día."]},{id:"restaurantes",tag:"Inspiración",title:"Webs de restaurantes que llenan mesas",img:"img/blog-restaurants.webp",read:"5 min",body:["Las mejores webs de restaurantes resuelven e
